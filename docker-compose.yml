services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: novel_reader
      POSTGRES_USER: novel_app
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5432:5432"
    volumes:
      - novel_reader_pgdata:/var/lib/postgresql/data

volumes:
  novel_reader_pgdata:
